name: DAM 0488 - Qualitat Unitat 0

on:
  push:
    branches:
      - docs/dam0488-annex-csharp-iniciacio
    paths:
      - "ioc/dam_0488/annex-csharp/**"
      - "ioc/dam_0488/assets/img/annex-csharp/**"
      - "ioc/dam_0488/index.html"
      - ".github/workflows/dam0488-unitat0.yml"
  pull_request:
    paths:
      - "ioc/dam_0488/annex-csharp/**"
      - "ioc/dam_0488/assets/img/annex-csharp/**"
      - "ioc/dam_0488/index.html"
      - ".github/workflows/dam0488-unitat0.yml"

permissions:
  contents: read

jobs:
  materials:
    name: HTML, navegacio i figures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ioc/dam_0488/annex-csharp/tests/validar_materials.py

  csharp:
    name: Compilacio C# i proves funcionals
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Compilar l'exemple de Windows Forms
        run: dotnet build ioc/dam_0488/annex-csharp/exemples/MiniCataleg/MiniCataleg.csproj --configuration Release --nologo
      - name: Executar les proves de model i gestor
        run: dotnet run --project ioc/dam_0488/annex-csharp/tests/MiniCataleg.Verificacio/MiniCataleg.Verificacio.csproj --configuration Release --no-launch-profile
