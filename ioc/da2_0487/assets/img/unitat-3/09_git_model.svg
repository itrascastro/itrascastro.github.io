<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Model mental de Git</title><desc id="desc">Working tree, staging area i repositori local</desc>
<rect width="1200" height="680" rx="24" fill="#f8fafc"/><rect x="40" y="32" width="1120" height="72" rx="16" fill="#0f172a"/><text x="600" y="78" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">Git: tres zones abans de pensar en GitHub</text>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs>
<g font-family="Arial" text-anchor="middle">
<rect x="80" y="205" width="280" height="190" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="220" y="255" font-size="24" font-weight="700" fill="#1e3a8a">WORKING TREE</text><text x="220" y="300" font-size="18" fill="#1e3a8a">fitxers que edites</text><text x="220" y="338" font-size="17" fill="#1e3a8a">Reserva.java modificat</text>
<rect x="460" y="205" width="280" height="190" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="600" y="255" font-size="24" font-weight="700" fill="#92400e">STAGING AREA</text><text x="600" y="300" font-size="18" fill="#92400e">canvis seleccionats</text><text x="600" y="338" font-size="17" fill="#92400e">pròxima fotografia</text>
<rect x="840" y="205" width="280" height="190" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="980" y="255" font-size="24" font-weight="700" fill="#14532d">REPOSITORI</text><text x="980" y="300" font-size="18" fill="#14532d">historial local</text><text x="980" y="338" font-size="17" fill="#14532d">A → B → C</text>
</g>
<line x1="360" y1="300" x2="445" y2="300" stroke="#334155" stroke-width="5" marker-end="url(#a)"/><text x="402" y="275" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#334155">git add</text>
<line x1="740" y1="300" x2="825" y2="300" stroke="#334155" stroke-width="5" marker-end="url(#a)"/><text x="782" y="275" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#334155">git commit</text>
<rect x="240" y="480" width="720" height="100" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="600" y="520" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#4c1d95">git status = «on sóc i què tinc pendent?»</text><text x="600" y="555" text-anchor="middle" font-family="Arial" font-size="18" fill="#4c1d95">consulteu-lo abans i després de cada pas important</text></svg>