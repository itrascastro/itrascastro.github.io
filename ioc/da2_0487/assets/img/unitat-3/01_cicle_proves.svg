<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Cicle de proves</title><desc id="desc">De la planificació a la correcció i repetició</desc>
<rect width="1200" height="680" rx="24" fill="#f8fafc"/><rect x="40" y="32" width="1120" height="72" rx="16" fill="#0f172a"/>
<text x="600" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#fff">Provar és un cicle, no un clic</text>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="75" y="250" width="185" height="105" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="167" y="292" font-size="21" font-weight="700" fill="#1e3a8a">PLANIFICAR</text><text x="167" y="325" font-size="16" fill="#1e3a8a">què comprovarem?</text>
<rect x="315" y="250" width="185" height="105" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="407" y="292" font-size="21" font-weight="700" fill="#4c1d95">DISSENYAR</text><text x="407" y="325" font-size="16" fill="#4c1d95">casos i dades</text>
<rect x="555" y="250" width="185" height="105" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="647" y="292" font-size="21" font-weight="700" fill="#92400e">EXECUTAR</text><text x="647" y="325" font-size="16" fill="#92400e">obtenir resultat</text>
<rect x="795" y="250" width="185" height="105" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="887" y="292" font-size="21" font-weight="700" fill="#14532d">COMPARAR</text><text x="887" y="325" font-size="16" fill="#14532d">esperat / obtingut</text>
<rect x="455" y="470" width="290" height="92" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="600" y="508" font-size="21" font-weight="700" fill="#991b1b">CORREGIR SI FALLA</text><text x="600" y="540" font-size="16" fill="#991b1b">i tornar a executar</text>
</g>
<line x1="260" y1="302" x2="300" y2="302" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><line x1="500" y1="302" x2="540" y2="302" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><line x1="740" y1="302" x2="780" y2="302" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
<path d="M887 355 C887 430 760 445 690 470" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#a)"/><path d="M455 516 C245 516 150 450 165 370" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
<text x="600" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a">Un error detectat alimenta una nova volta del cicle</text></svg>