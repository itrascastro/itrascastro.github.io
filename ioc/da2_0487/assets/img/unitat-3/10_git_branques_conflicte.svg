<rect x="250" y="520" width="700" height="90" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="600" y="557" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#92400e">No és «acceptar el nostre» o «acceptar l'altre»</text><text x="600" y="590" text-anchor="middle" font-family="Arial" font-size="18" fill="#92400e">la solució pot combinar les dues intencions</text></svg>