<text x="500" y="184" font-family="Arial" font-size="20" font-weight="700" fill="#1e3a8a">double durada</text><text x="500" y="414" font-family="Arial" font-size="20" font-weight="700" fill="#4c1d95">int horesReserva</text>
<path d="M397 190 C560 190 620 260 705 300" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/><path d="M397 420 C560 420 620 350 705 310" fill="none" stroke="#7c3aed" stroke-width="5" marker-end="url(#a)"/>
