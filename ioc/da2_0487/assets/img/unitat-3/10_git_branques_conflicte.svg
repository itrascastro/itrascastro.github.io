<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Branques i conflicte Git</title><desc id="desc">Dues branques modifiquen el mateix atribut i es resol combinant tipus i nom</desc>
