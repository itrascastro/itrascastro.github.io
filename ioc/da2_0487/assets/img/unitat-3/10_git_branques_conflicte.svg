<circle cx="355" cy="190" r="42" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="355" y="198" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1e3a8a">B</text>
