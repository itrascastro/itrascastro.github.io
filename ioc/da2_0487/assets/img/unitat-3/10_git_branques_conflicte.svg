<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs>
<circle cx="145" cy="300" r="34" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/><text x="145" y="308" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">A</text>
