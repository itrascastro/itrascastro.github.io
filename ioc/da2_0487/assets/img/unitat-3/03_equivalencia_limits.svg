<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Classes d'equivalència i valors límit</title><desc id="desc">Rangs de puntuació de menys de zero a més de cent</desc>
<rect width="1200" height="680" rx="24" fill="#f8fafc"/><rect x="40" y="32" width="1120" height="72" rx="16" fill="#0f172a"/><text x="600" y="78" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">Classes d'equivalència: on canvia el tractament?</text>
<line x1="90" y1="330" x2="1110" y2="330" stroke="#334155" stroke-width="5"/>
<g font-family="Arial" text-anchor="middle" font-size="18" fill="#0f172a">
<rect x="90" y="220" width="145" height="80" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="162" y="254" font-weight="700">C1</text><text x="162" y="280">&lt; 0</text>
<rect x="235" y="220" width="205" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="337" y="254" font-weight="700">C2</text><text x="337" y="280">0..49</text>
<rect x="440" y="220" width="160" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="520" y="254" font-weight="700">C3</text><text x="520" y="280">50..69</text>
<rect x="600" y="220" width="160" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="680" y="254" font-weight="700">C4</text><text x="680" y="280">70..89</text>
<rect x="760" y="220" width="205" height="80" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="862" y="254" font-weight="700">C5</text><text x="862" y="280">90..100</text>
<rect x="965" y="220" width="145" height="80" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="1037" y="254" font-weight="700">C6</text><text x="1037" y="280">&gt; 100</text>
</g>
<g stroke="#334155" stroke-width="3" font-family="Arial" font-size="17" text-anchor="middle" fill="#334155">
<line x1="235" y1="315" x2="235" y2="350"/><text x="235" y="380">0</text>
<line x1="440" y1="315" x2="440" y2="350"/><text x="440" y="380">50</text>
<line x1="600" y1="315" x2="600" y2="350"/><text x="600" y="380">70</text>
<line x1="760" y1="315" x2="760" y2="350"/><text x="760" y="380">90</text>
<line x1="965" y1="315" x2="965" y2="350"/><text x="965" y="380">101</text>
</g>
<rect x="165" y="445" width="870" height="112" rx="16" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="600" y="485" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#0f172a">Valors límit que mereixen atenció</text><text x="600" y="528" text-anchor="middle" font-family="Arial" font-size="21" fill="#475569">-1 · 0 · 49 · 50 · 69 · 70 · 89 · 90 · 100 · 101</text><text x="600" y="615" text-anchor="middle" font-family="Arial" font-size="20" fill="#0f172a">A cada frontera, proveu el valor d'un costat i el de l'altre</text></svg>