<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Mapa de tipus de proves</title><desc id="desc">Des de proves unitàries fins a acceptació amb regressió transversal</desc>
<rect width="1200" height="680" rx="24" fill="#f8fafc"/><rect x="40" y="32" width="1120" height="72" rx="16" fill="#0f172a"/><text x="600" y="78" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">Tipus de proves: de la peça al sistema</text>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs>
<g font-family="Arial" text-anchor="middle">
<rect x="70" y="190" width="175" height="100" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="157" y="232" font-size="20" font-weight="700" fill="#1e3a8a">UNITÀRIES</text><text x="157" y="262" font-size="15" fill="#1e3a8a">funció / classe</text>
<rect x="285" y="190" width="175" height="100" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="372" y="232" font-size="20" font-weight="700" fill="#4c1d95">INTEGRACIÓ</text><text x="372" y="262" font-size="15" fill="#4c1d95">components</text>
<rect x="500" y="190" width="175" height="100" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="587" y="232" font-size="20" font-weight="700" fill="#92400e">SISTEMES</text><text x="587" y="262" font-size="15" fill="#92400e">requeriments</text>
<rect x="715" y="190" width="175" height="100" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="802" y="232" font-size="20" font-weight="700" fill="#14532d">CÀRREGA</text><text x="802" y="262" font-size="15" fill="#14532d">rendiment</text>
<rect x="930" y="190" width="200" height="100" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="1030" y="232" font-size="20" font-weight="700" fill="#991b1b">ACCEPTACIÓ</text><text x="1030" y="262" font-size="15" fill="#991b1b">alfa / beta</text>
</g>
<line x1="245" y1="240" x2="270" y2="240" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><line x1="460" y1="240" x2="485" y2="240" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><line x1="675" y1="240" x2="700" y2="240" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><line x1="890" y1="240" x2="915" y2="240" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
<rect x="145" y="390" width="910" height="110" rx="18" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/><text x="600" y="432" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">REGRESSIÓ</text><text x="600" y="468" text-anchor="middle" font-family="Arial" font-size="19" fill="#475569">després de cada canvi, repetim proves que abans passaven</text>
<path d="M600 390 C600 345 600 330 600 305" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><text x="600" y="575" text-anchor="middle" font-family="Arial" font-size="22" fill="#0f172a">Capsa negra o blanca descriu l'enfocament, no el nivell de la prova</text></svg>