<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Del cas de prova a JUnit</title><desc id="desc">Flux de disseny, mètode Test, assertion i resultat</desc>
<rect width="1200" height="680" rx="24" fill="#f8fafc"/><rect x="40" y="32" width="1120" height="72" rx="16" fill="#0f172a"/><text x="600" y="78" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">JUnit 5: automatitzar una expectativa</text>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs>
<g font-family="Arial" text-anchor="middle">
<rect x="70" y="225" width="230" height="125" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="185" y="267" font-size="21" font-weight="700" fill="#1e3a8a">CAS DE PROVA</text><text x="185" y="302" font-size="17" fill="#1e3a8a">entrada: 50</text><text x="185" y="328" font-size="17" fill="#1e3a8a">esperat: "Bé"</text>
<rect x="385" y="225" width="230" height="125" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="500" y="267" font-size="21" font-weight="700" fill="#4c1d95">@Test</text><text x="500" y="304" font-size="17" fill="#4c1d95">executa el mètode</text>
<rect x="700" y="225" width="230" height="125" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="815" y="267" font-size="21" font-weight="700" fill="#92400e">ASSERTION</text><text x="815" y="304" font-size="17" fill="#92400e">esperat == real?</text>
</g>
<line x1="300" y1="287" x2="370" y2="287" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><line x1="615" y1="287" x2="685" y2="287" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
<path d="M930 265 C990 240 1020 220 1060 205" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#a)"/><path d="M930 315 C990 350 1020 390 1060 420" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#a)"/>
<circle cx="1080" cy="190" r="55" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="1080" y="199" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#14532d">VERD</text>
<circle cx="1080" cy="440" r="55" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/><text x="1080" y="449" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#991b1b">VERMELL</text>
<rect x="205" y="470" width="790" height="100" rx="16" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="600" y="510" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#0f172a">JUnit repeteix la comprovació; no inventa el resultat esperat</text><text x="600" y="545" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">la qualitat del test depèn del disseny del cas</text></svg>