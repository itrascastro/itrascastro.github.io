<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Cicle segur de refacció</title><desc id="desc">Tests verds, canvi petit, tests de nou i decisió</desc>
<rect width="1200" height="680" rx="24" fill="#f8fafc"/><rect x="40" y="32" width="1120" height="72" rx="16" fill="#0f172a"/><text x="600" y="78" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">Refacció segura: un canvi petit cada vegada</text>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs>
<g font-family="Arial" text-anchor="middle">
<circle cx="250" cy="300" r="105" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="250" y="286" font-size="22" font-weight="700" fill="#14532d">1. TESTS VERDS</text><text x="250" y="322" font-size="17" fill="#14532d">punt de partida</text>
<circle cx="600" cy="300" r="105" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="600" y="286" font-size="22" font-weight="700" fill="#1e3a8a">2. CANVI PETIT</text><text x="600" y="322" font-size="17" fill="#1e3a8a">una refacció</text>
<circle cx="950" cy="300" r="105" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="950" y="286" font-size="22" font-weight="700" fill="#92400e">3. TORNAR A</text><text x="950" y="316" font-size="22" font-weight="700" fill="#92400e">PROVAR</text>
</g>
<line x1="355" y1="300" x2="480" y2="300" stroke="#334155" stroke-width="5" marker-end="url(#a)"/><line x1="705" y1="300" x2="830" y2="300" stroke="#334155" stroke-width="5" marker-end="url(#a)"/>
<path d="M950 405 C900 540 350 540 250 420" fill="none" stroke="#16a34a" stroke-width="5" marker-end="url(#a)"/><text x="600" y="515" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#14532d">si tot continua verd → conservar i fer el següent canvi</text>
<path d="M950 195 C875 125 690 125 620 190" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#a)"/><text x="790" y="145" text-anchor="middle" font-family="Arial" font-size="17" fill="#991b1b">si falla → investigar o desfer</text><text x="600" y="610" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#0f172a">La bateria de proves és la xarxa de seguretat</text></svg>