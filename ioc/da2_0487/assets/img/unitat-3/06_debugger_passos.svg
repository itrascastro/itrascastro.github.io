<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Depuració pas a pas</title><desc id="desc">Breakpoint, observar variables, avançar, formular hipòtesi i corregir</desc>
<rect width="1200" height="680" rx="24" fill="#f8fafc"/><rect x="40" y="32" width="1120" height="72" rx="16" fill="#0f172a"/><text x="600" y="78" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">Depurar = aturar + observar + avançar</text>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs>
<g font-family="Arial" text-anchor="middle">
<rect x="65" y="220" width="190" height="115" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="160" y="260" font-size="20" font-weight="700" fill="#991b1b">1. BREAKPOINT</text><text x="160" y="295" font-size="16" fill="#991b1b">atura aquí</text>
<rect x="300" y="220" width="190" height="115" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="395" y="260" font-size="20" font-weight="700" fill="#1e3a8a">2. OBSERVAR</text><text x="395" y="295" font-size="16" fill="#1e3a8a">variables / estat</text>
<rect x="535" y="220" width="190" height="115" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="630" y="260" font-size="20" font-weight="700" fill="#92400e">3. AVANÇAR</text><text x="630" y="295" font-size="16" fill="#92400e">Step Into / Over</text>
<rect x="770" y="220" width="190" height="115" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="865" y="260" font-size="20" font-weight="700" fill="#4c1d95">4. EXPLICAR</text><text x="865" y="295" font-size="16" fill="#4c1d95">causa observada</text>
<rect x="1005" y="220" width="150" height="115" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1080" y="260" font-size="20" font-weight="700" fill="#14532d">5. CORREGIR</text><text x="1080" y="295" font-size="16" fill="#14532d">i reprovem</text>
</g>
<line x1="255" y1="277" x2="285" y2="277" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><line x1="490" y1="277" x2="520" y2="277" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><line x1="725" y1="277" x2="755" y2="277" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><line x1="960" y1="277" x2="990" y2="277" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
<rect x="155" y="440" width="890" height="120" rx="18" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/><text x="600" y="484" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#0f172a">Pregunta útil: «quin valor té ara i per què ha entrat per aquesta branca?»</text><text x="600" y="525" text-anchor="middle" font-family="Arial" font-size="19" fill="#475569">El depurador converteix una sospita en una observació reproduïble</text></svg>