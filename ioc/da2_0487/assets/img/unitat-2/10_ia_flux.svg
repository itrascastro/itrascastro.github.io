<text x="600" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Assistència d'IA: suggerir no és validar</text>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs><rect x="65" y="245" width="190" height="110" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="160" y="285" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#1e3a8a">1. DESCRIURE</text><text x="160" y="318" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e3a8a">comentari / prompt</text><line x1="255" y1="300" x2="335" y2="300" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/><rect x="350" y="245" width="190" height="110" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="445" y="285" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#4c1d95">2. SUGGERIR</text><text x="445" y="318" text-anchor="middle" font-family="Arial" font-size="16" fill="#4c1d95">assistent d'IA</text><line x1="540" y1="300" x2="620" y2="300" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/><rect x="635" y="245" width="190" height="110" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="730" y="285" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#92400e">3. REVISAR</text><text x="730" y="318" text-anchor="middle" font-family="Arial" font-size="16" fill="#92400e">entendre el codi</text><line x1="825" y1="300" x2="905" y2="300" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/><rect x="920" y="245" width="215" height="110" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1027" y="285" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#14532d">4. PROVAR</text><text x="1027" y="318" text-anchor="middle" font-family="Arial" font-size="16" fill="#14532d">casos coneguts</text><path d="M 1027 355 C 1027 500 160 500 160 360" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/><text x="595" y="525" text-anchor="middle" font-family="Arial" font-size="19" fill="#b91c1c">si no compleix el requisit → precisar, corregir i tornar a provar</text><text x="600" y="590" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">L'assistent proposa; tu decideixes si és correcte</text></svg>