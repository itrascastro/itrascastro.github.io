y="Arial" font-size="18" fill="#4c1d95">programa final</text><line x1="930" y1="285" x2="1040" y2="285" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/><rect x="1050" y="230" width="90" height="110" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="1095" y="276" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#7f1d1d">CPU</text><text x="1095" y="303" text-anchor="middle" font-family="Arial" font-size="16" fill="#7f1d1d">executa</text><text x="600" y="605" text-anchor="middle" font-family="Arial" font-size="22" fill="#475569">Font → traducció → objecte + biblioteques → enllaçament → executable</text></svg>