<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs><rect x="55" y="245" width="190" height="125" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><rect x="280" y="245" width="190" height="125" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><rect x="505" y="245" width="190" height="125" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><rect x="730" y="245" width="190" height="125" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><rect x="955" y="245" width="190" height="125" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="150" y="284" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#1e3a8a">1. VIABILITAT</text><text x="150" y="320" text-anchor="middle" font-family="Arial" font-size="17" fill="#1e3a8a">Convé fer-ho?</text><text x="375" y="284" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#14532d">2. ANÀLISI</text><text x="375" y="320" text-anchor="middle" font-family="Arial" font-size="17" fill="#14532d">Què necessita?</text><text x="600" y="284" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#92400e">3. DISSENY</text><text x="600" y="320" text-anchor="middle" font-family="Arial" font-size="17" fill="#92400e">Com serà?</text><text x="825" y="284" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#4c1d95">4. CONSTRUCCIÓ</text><text x="825" y="320" text-anchor="middle" font-family="Arial" font-size="17" fill="#4c1d95">Codi + proves</text><text x="1050" y="278" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#7f1d1d">5. IMPLANTACIÓ</text><text x="1050" y="305" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#7f1d1d">I ACCEPTACIÓ</text><text x="1050" y="337" text-anchor="middle" font-family="Arial" font-size="17" fill="#7f1d