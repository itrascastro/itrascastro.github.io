<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Construir un formulari per etapes</title><desc id="desc">Construir un formulari per etapes</desc>
<rect width="1200" height="680" rx="24" fill="#f8fafc"/>
<rect x="40" y="32" width="1120" height="72" rx="16" fill="#0f172a"/>
<text x="600" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Construir un formulari per etapes</text>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs><rect x="65" y="245" width="220" height="120" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="175" y="286" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#1e3a8a">1. DADES</text><text x="175" y="320" text-anchor="middle" font-family="Arial" font-size="17" fill="#1e3a8a">text + combos</text><line x1="285" y1="305" x2="360" y2="305" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/><rect x="375" y="245" width="220" height="120" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="485" y="286" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#92400e">2. VALIDAR</text><text x="485" y="320" text-anchor="middle" font-family="Arial" font-size="17" fill="#92400e">si falla → error</text><line x1="595" y1="305" x2="670" y2="305" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/><rect x="685" y="245" width="220" height="120" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="795" y="286" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#4c1d95">3. OPCIONS</text><text x="795" y="320" text-anchor="middle" font-family="Arial" font-size="17" fill="#4c1d95">habilitar etapa 2</text><line x1="905" y1="305" x2="980" y2="305" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/><rect x="995" y="245" width="150" height="120" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1070" y="286" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#14532d">4. CALCULAR</text><text x="1070" y="320" text-anchor="middle" font-family="Arial" font-size="16" fill="#14532d">resultats</text><path d="M 485 365 C 485 500 270 500 270 405" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/><text x="350" y="515" text-anchor="middle" font-family="Arial" font-size="18" fill="#b91c1c">error: corregir i tornar a validar</text><text x="600" y="590" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#0f172a">Un formulari gran és una seqüència de petits estats</text></svg>