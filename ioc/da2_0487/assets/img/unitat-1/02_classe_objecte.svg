<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img">
<style>
  .bg{fill:#fff}.panel{fill:#f7fbff;stroke:#c7ddf4;stroke-width:2}.head{fill:#e9f4ff;stroke:#1870bd;stroke-width:3}
  .box{fill:#fff;stroke:#174f86;stroke-width:2}.soft{fill:#eef6fd;stroke:#a8cbea;stroke-width:1.5}
  .line{stroke:#355b7d;stroke-width:3;fill:none}.dash{stroke:#355b7d;stroke-width:2.5;fill:none;stroke-dasharray:8 7}
  .blue{fill:#1769aa}.dark{fill:#102b4e}.muted{fill:#4e667c}.green{stroke:#2e8b57}.red{stroke:#c23b45}
  text{font-family:Arial,Helvetica,sans-serif;fill:#102b4e}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#405b73}
  .h{font-size:23px;font-weight:700}.m{font-size:18px}.s{font-size:15px}.b{font-weight:700}
</style><rect class="bg" width="1200" height="720"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#355b7d"/></marker><marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2e8b57"/></marker><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#c23b45"/></marker></defs>
<rect class="head" x="150" y="20" rx="18" width="900" height="90"/><text class="title" x="600" y="62" text-anchor="middle">Classe, atribut, operació i objecte</text><text class="sub" x="600" y="91" text-anchor="middle">Una classe descriu; un objecte conté valors concrets</text>
<rect class="panel" x="45" y="145" rx="18" width="540" height="500"/><rect class="panel" x="615" y="145" rx="18" width="540" height="500"/>
<text class="h" x="80" y="188">Classe UML</text>
<rect class="box" x="115" y="225" width="390" height="270"/><line class="line" x1="115" y1="285" x2="505" y2="285"/><line class="line" x1="115" y1="405" x2="505" y2="405"/>
<text class="h" x="310" y="263" text-anchor="middle">Pellicula</text>
<text class="m" x="145" y="325">- titol: String</text><text class="m" x="145" y="360">- duradaMinuts: int</text><text class="m" x="145" y="395">- edatMinima: int</text>
<text class="m" x="145" y="453">+ esApta(edat: int): boolean</text>
<text class="s" x="90" y="545">Visibilitat:</text><text class="m" x="190" y="545">+ públic   - privat   # protegit   ~ paquet</text>
<text class="h" x="650" y="188">Instàncies (objectes)</text>
<rect class="box" x="660" y="235" width="215" height="225"/><rect class="box" x="900" y="235" width="215" height="225"/>
<text class="h" x="767" y="276" text-anchor="middle" text-decoration="underline">p1:Pellicula</text><text class="m" x="685" y="325">titol = "Arrival"</text><text class="m" x="685" y="365">edatMinima = 7</text>
<text class="h" x="1007" y="276" text-anchor="middle" text-decoration="underline">p2:Pellicula</text><text class="m" x="925" y="325">titol = "Alien"</text><text class="m" x="925" y="365">edatMinima = 18</text>
<rect class="soft" x="680" y="505" rx="12" width="415" height="95"/><text class="m b" x="710" y="545">Classe = tipus</text><text class="m" x="710" y="580">Objecte = instància concreta</text>
</svg>