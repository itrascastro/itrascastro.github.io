<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Eco TCP</title><desc id="d">Seqüència entre ServerSocket i client: escolta, connexió, acceptació, intercanvi de línies i tancament.</desc><rect width="1600" height="900" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#17324f}.title{font-size:58px;font-weight:700}.h{font-size:34px;font-weight:700}.t{font-size:25px}.small{font-size:21px}.box{stroke:#17324f;stroke-width:4;rx:22}.line{stroke:#17324f;stroke-width:4}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17324f"/></marker></defs><text x="800" y="80" text-anchor="middle" class="title">Cicle d'una connexió TCP</text><text x="350" y="155" text-anchor="middle" class="h">Client</text><text x="1250" y="155" text-anchor="middle" class="h">Servidor</text><line x1="350" y1="190" x2="350" y2="810" class="line"/><line x1="1250" y1="190" x2="1250" y2="810" class="line"/><rect x="1030" y="205" width="440" height="85" class="box" fill="#fff3cc"/><text x="1250" y="260" text-anchor="middle" class="t">new ServerSocket(5000)</text><path d="M370 355H1230" class="line" marker-end="url(#a)"/><text x="800" y="330" text-anchor="middle" class="t">new Socket(host, 5000)</text><rect x="1055" y="380" width="390" height="80" class="box" fill="#e9fae6"/><text x="1250" y="432" text-anchor="middle" class="t">accept() → Socket client</text><path d="M370 525H1230" class="line" marker-end="url(#a)"/><text x="800" y="500" text-anchor="middle" class="t">"hola\n"</text><path d="M1230 625H370" class="line" marker-end="url(#a)"/><text x="800" y="600" text-anchor="middle" class="t">"HOLA\n"</text><path d="M370 725H1230" class="line" marker-end="url(#a)"/><text x="800" y="700" text-anchor="middle" class="t">"fi\n"</text><text x="800" y="835" text-anchor="middle" class="small">ServerSocket escolta · Socket conversa</text></svg>