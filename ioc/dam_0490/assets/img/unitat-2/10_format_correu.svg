<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Format d'un missatge de correu</title><desc id="d">Un missatge es divideix en capçaleres, una línia en blanc obligatòria i el cos.</desc><rect width="1600" height="900" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#17324f}.title{font-size:58px;font-weight:700}.h{font-size:34px;font-weight:700}.t{font-size:25px}.small{font-size:21px}.box{stroke:#17324f;stroke-width:4;rx:22}</style><text x="800" y="80" text-anchor="middle" class="title">Estructura d'un correu de text</text><rect x="330" y="145" width="940" height="610" class="box" fill="#eef5ff"/><rect x="390" y="205" width="820" height="285" class="box" fill="#e7f4ff"/><text x="800" y="255" text-anchor="middle" class="h">Capçaleres</text><text x="465" y="320" class="t">Date: ...</text><text x="465" y="365" class="t">From: ...</text><text x="465" y="410" class="t">To: ...</text><text x="850" y="320" class="t">Subject: ...</text><text x="850" y="365" class="t">Message-ID: ...</text><text x="850" y="410" class="t">Reply-To: ...</text><rect x="390" y="510" width="820" height="65" class="box" fill="#fff3cc"/><text x="800" y="552" text-anchor="middle" class="t">línia en blanc obligatòria</text><rect x="390" y="595" width="820" height="105" class="box" fill="#e9fae6"/><text x="800" y="642" text-anchor="middle" class="h">Cos</text><text x="800" y="680" text-anchor="middle" class="small">text, MIME, HTML, adjunts...</text><text x="800" y="825" text-anchor="middle" class="small">Les capçaleres descriuen el missatge; el cos conté el contingut.</text></svg>