<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">TCP i UDP</title><desc id="d">TCP es representa com un flux ordenat i fiable; UDP com datagrames independents que poden perdre's o arribar desordenats.</desc><rect width="1600" height="900" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#17324f}.title{font-size:58px;font-weight:700}.h{font-size:38px;font-weight:700}.t{font-size:27px}.small{font-size:22px}.box{stroke:#17324f;stroke-width:4;rx:22}</style><text x="800" y="85" text-anchor="middle" class="title">TCP i UDP ofereixen contractes diferents</text><rect x="70" y="150" width="700" height="650" class="box" fill="#e7f4ff"/><text x="420" y="220" text-anchor="middle" class="h">TCP</text><text x="420" y="275" text-anchor="middle" class="t">flux de bytes ordenat i fiable</text><rect x="145" y="355" width="100" height="95" class="box" fill="#e9fae6"/><rect x="255" y="355" width="100" height="95" class="box" fill="#e9fae6"/><rect x="365" y="355" width="100" height="95" class="box" fill="#e9fae6"/><rect x="475" y="355" width="100" height="95" class="box" fill="#e9fae6"/><rect x="585" y="355" width="100" height="95" class="box" fill="#e9fae6"/><text x="195" y="414" text-anchor="middle" class="t">A</text><text x="305" y="414" text-anchor="middle" class="t">B</text><text x="415" y="414" text-anchor="middle" class="t">C</text><text x="525" y="414" text-anchor="middle" class="t">D</text><text x="635" y="414" text-anchor="middle" class="t">E</text><text x="420" y="535" text-anchor="middle" class="small">l'aplicació defineix els límits dels missatges</text><text x="420" y="590" text-anchor="middle" class="small">connexió prèvia</text><text x="420" y="640" text-anchor="middle" class="small">retransmissió i ordre gestionats per TCP</text><rect x="830" y="150" width="700" height="650" class="box" fill="#fff3cc"/><text x="1180" y="220" text-anchor="middle" class="h">UDP</text><text x="1180" y="275" text-anchor="middle" class="t">datagrames independents</text><rect x="900" y="340" width="160" height="100" class="box" fill="#e9fae6"/><rect x="1140" y="360" width="160" height="100" class="box" fill="#e9fae6"/><rect x="1330" y="500" width="160" height="100" class="box" fill="#fff0f0"/><text x="980" y="402" text-anchor="middle" class="t">#1</text><text x="1220" y="422" text-anchor="middle" class="t">#3</text><text x="1410" y="562" text-anchor="middle" class="t">#2 perdut?</text><text x="1180" y="665" text-anchor="middle" class="small">sense connexió prèvia · possible pèrdua o desordre</text></svg>