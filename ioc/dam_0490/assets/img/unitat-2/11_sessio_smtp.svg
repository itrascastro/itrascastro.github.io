<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Sessió SMTP</title><desc id="d">Seqüència de comandes i respostes d'una sessió SMTP simplificada.</desc><rect width="1600" height="900" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#17324f}.title{font-size:58px;font-weight:700}.h{font-size:34px;font-weight:700}.t{font-size:23px}.small{font-size:20px}.box{stroke:#17324f;stroke-width:4;rx:22}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17324f"/></marker></defs><text x="800" y="78" text-anchor="middle" class="title">Una sessió SMTP té ordre</text><text x="330" y="145" text-anchor="middle" class="h">Client</text><text x="1270" y="145" text-anchor="middle" class="h">Servidor</text><line x1="330" y1="170" x2="330" y2="830" stroke="#17324f" stroke-width="4"/><line x1="1270" y1="170" x2="1270" y2="830" stroke="#17324f" stroke-width="4"/><path d="M1250 220H350" stroke="#17324f" stroke-width="4" marker-end="url(#a)"/><text x="800" y="205" text-anchor="middle" class="t">220 ready</text><path d="M350 290H1250" stroke="#17324f" stroke-width="4" marker-end="url(#a)"/><text x="800" y="275" text-anchor="middle" class="t">EHLO client</text><path d="M1250 350H350" stroke="#17324f" stroke-width="4" marker-end="url(#a)"/><text x="800" y="335" text-anchor="middle" class="t">250 hello</text><path d="M350 415H1250" stroke="#17324f" stroke-width="4" marker-end="url(#a)"/><text x="800" y="400" text-anchor="middle" class="t">MAIL FROM</text><path d="M350 480H1250" stroke="#17324f" stroke-width="4" marker-end="url(#a)"/><text x="800" y="465" text-anchor="middle" class="t">RCPT TO</text><path d="M350 545H1250" stroke="#17324f" stroke-width="4" marker-end="url(#a)"/><text x="800" y="530" text-anchor="middle" class="t">DATA</text><path d="M1250 605H350" stroke="#17324f" stroke-width="4" marker-end="url(#a)"/><text x="800" y="590" text-anchor="middle" class="t">354 start mail input</text><path d="M350 675H1250" stroke="#17324f" stroke-width="4" marker-end="url(#a)"/><text x="800" y="650" text-anchor="middle" class="t">capçaleres + cos + línia "."</text><path d="M1250 735H350" stroke="#17324f" stroke-width="4" marker-end="url(#a)"/><text x="800" y="720" text-anchor="middle" class="t">250 accepted</text><path d="M350 795H1250" stroke="#17324f" stroke-width="4" marker-end="url(#a)"/><text x="800" y="780" text-anchor="middle" class="t">QUIT</text></svg>