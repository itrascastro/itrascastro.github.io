<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Servidor seqüencial i concurrent</title><desc id="d">Comparació entre atendre el client en el fil principal i delegar cada sessió a un fil o tasca independent.</desc><rect width="1600" height="900" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#17324f}.title{font-size:58px;font-weight:700}.h{font-size:34px;font-weight:700}.t{font-size:25px}.small{font-size:21px}.box{stroke:#17324f;stroke-width:4;rx:22}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17324f"/></marker></defs><text x="800" y="80" text-anchor="middle" class="title">Acceptar i atendre són responsabilitats diferents</text><rect x="70" y="150" width="700" height="670" class="box" fill="#fff0f0"/><text x="420" y="220" text-anchor="middle" class="h">Servidor seqüencial</text><rect x="190" y="290" width="460" height="95" class="box" fill="#fff3cc"/><text x="420" y="350" text-anchor="middle" class="t">main: accept()</text><path d="M420 390V455" stroke="#17324f" stroke-width="5" marker-end="url(#a)"/><rect x="190" y="465" width="460" height="150" class="box" fill="#e7f4ff"/><text x="420" y="525" text-anchor="middle" class="t">main: atén Client A</text><text x="420" y="575" text-anchor="middle" class="small">pot quedar bloquejat a readLine()</text><path d="M420 620V690" stroke="#17324f" stroke-width="5" marker-end="url(#a)"/><text x="420" y="745" text-anchor="middle" class="small">Client B espera ser atès</text><rect x="830" y="150" width="700" height="670" class="box" fill="#e9fae6"/><text x="1180" y="220" text-anchor="middle" class="h">Servidor concurrent</text><rect x="1010" y="275" width="340" height="90" class="box" fill="#fff3cc"/><text x="1180" y="332" text-anchor="middle" class="t">main: accept()</text><path d="M1180 370V430" stroke="#17324f" stroke-width="5" marker-end="url(#a)"/><rect x="900" y="445" 