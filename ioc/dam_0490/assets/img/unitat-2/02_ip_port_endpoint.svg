<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">IP, port i endpoint</title><desc id="d">Una adreça IP identifica la màquina i ports diferents dirigeixen el trànsit a serveis diferents.</desc><rect width="1600" height="900" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#17324f}.title{font-size:58px;font-weight:700}.h{font-size:34px;font-weight:700}.t{font-size:27px}.small{font-size:22px}.box{stroke:#17324f;stroke-width:4;rx:22}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17324f"/></marker></defs><text x="800" y="85" text-anchor="middle" class="title">IP + port = endpoint</text><rect x="470" y="150" width="660" height="610" class="box" fill="#eef5ff"/><text x="800" y="215" text-anchor="middle" class="h">Màquina 192.168.1.50</text><rect x="585" y="290" width="430" height="95" class="box" fill="#e9fae6"/><text x="800" y="350" text-anchor="middle" class="t">port 22 → SSH</text><rect x="585" y="420" width="430" height="95" class="box" fill="#e9fae6"/><text x="800" y="480" text-anchor="middle" class="t">port 80 → HTTP</text><rect x="585" y="550" width="430" height="95" class="box" fill="#fff3cc"/><text x="800" y="610" text-anchor="middle" class="t">port 5000 → eco TCP</text><path d="M150 465H450" stroke="#17324f" stroke-width="6" marker-end="url(#a)"/><text x="300" y="420" text-anchor="middle" class="h">Xarxa</text><text x="300" y="520" text-anchor="middle" class="small">la IP porta fins a la màquina</text><path d="M1150 595H1390" stroke="#17324f" stroke-width="6" marker-end="url(#a)"/><text x="1270" y="550" text-anchor="middle" class="small">el port selecciona</text><text x="1270" y="585" text-anchor="middle" class="small">el servei</text><rect x="475" y="790" width="650" height="70" class="box" fill="#fff0f0"/><text x="800" y="836" text-anchor="middle" class="t">192.168.1.50:5000</text></svg>