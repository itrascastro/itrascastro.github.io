<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Eco UDP</title><desc id="d">Un client envia un DatagramPacket i el servidor respon utilitzant l'adreça i el port d'origen del paquet rebut.</desc><rect width="1600" height="900" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#17324f}.title{font-size:58px;font-weight:700}.h{font-size:36px;font-weight:700}.t{font-size:27px}.small{font-size:22px}.box{stroke:#17324f;stroke-width:4;rx:22}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17324f"/></marker></defs><text x="800" y="85" text-anchor="middle" class="title">Eco UDP: datagrama a datagrama</text><rect x="90" y="260" width="430" height="300" class="box" fill="#e7f4ff"/><text x="305" y="335" text-anchor="middle" class="h">Client</text><text x="305" y="400" text-anchor="middle" class="t">DatagramSocket</text><text x="305" y="455" text-anchor="middle" class="small">port local efímer</text><rect x="1080" y="260" width="430" height="300" class="box" fill="#e9fae6"/><text x="1295" y="335" text-anchor="middle" class="h">Servidor</text><text x="1295" y="400" text-anchor="middle" class="t">DatagramSocket(5001)</text><text x="1295" y="455" text-anchor="middle" class="small">receive()</text><path d="M525 335H1060" stroke="#17324f" stroke-width="6" marker-end="url(#a)"/><text x="793" y="300" text-anchor="middle" class="t">paquet: "hola"</text><path d="M1075 500H540" stroke="#17324f" stroke-width="6" marker-end="url(#a)"/><text x="807" y="555" text-anchor="middle" class="t">paquet: "HOLA"</text><rect x="430" y="675" width="740" height="120" class="box" fill="#fff3cc"/><text x="800" y="725" text-anchor="middle" class="t">La resposta usa getAddress() + getPort()</text><text x="800" y="765" text-anchor="middle" class="small">del DatagramPacket rebut</text></svg>