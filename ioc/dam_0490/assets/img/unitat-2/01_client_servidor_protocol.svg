<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Client, servidor i protocol</title><desc id="d">Un client envia una petició a un servidor i rep una resposta segons un protocol compartit.</desc><rect width="1600" height="900" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#17324f}.title{font-size:58px;font-weight:700}.h{font-size:36px;font-weight:700}.t{font-size:28px}.small{font-size:23px}.box{stroke:#17324f;stroke-width:4;rx:24}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17324f"/></marker></defs><text x="800" y="90" text-anchor="middle" class="title">Client, servidor i protocol</text><rect x="120" y="260" width="430" height="310" class="box" fill="#e7f4ff"/><text x="335" y="350" text-anchor="middle" class="h">Client</text><text x="335" y="410" text-anchor="middle" class="t">inicia la comunicació</text><text x="335" y="460" text-anchor="middle" class="small">necessita un servei</text><rect x="1050" y="260" width="430" height="310" class="box" fill="#e9fae6"/><text x="1265" y="350" text-anchor="middle" class="h">Servidor</text><text x="1265" y="410" text-anchor="middle" class="t">espera peticions</text><text x="1265" y="460" text-anchor="middle" class="small">processa i respon</text><path d="M555 340H1030" stroke="#17324f" stroke-width="6" marker-end="url(#a)"/><text x="792" y="305" text-anchor="middle" class="t">petició</text><path d="M1045 500H570" stroke="#17324f" stroke-width="6" marker-end="url(#a)"/><text x="807" y="555" text-anchor="middle" class="t">resposta</text><rect x="500" y="660" width="600" height="120" class="box" fill="#fff3cc"/><text x="800" y="715" text-anchor="middle" class="h">Protocol compartit</text><text x="800" y="755" text-anchor="middle" class="small">format + ordre + significat dels missatges</text></svg>