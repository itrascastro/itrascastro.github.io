<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">DNS i InetAddress</title><desc id="d">Una aplicació resol un nom mitjançant el sistema DNS i obté una o més adreces IP que Java representa amb InetAddress.</desc><rect width="1600" height="900" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#17324f}.title{font-size:58px;font-weight:700}.h{font-size:34px;font-weight:700}.t{font-size:27px}.small{font-size:22px}.box{stroke:#17324f;stroke-width:4;rx:22}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17324f"/></marker></defs><text x="800" y="85" text-anchor="middle" class="title">Del nom a l'adreça</text><rect x="90" y="285" width="380" height="230" class="box" fill="#e7f4ff"/><text x="280" y="360" text-anchor="middle" class="h">Aplicació Java</text><text x="280" y="420" text-anchor="middle" class="t">example.org</text><rect x="610" y="255" width="380" height="290" class="box" fill="#fff3cc"/><text x="800" y="335" text-anchor="middle" class="h">Resolució</text><text x="800" y="390" text-anchor="middle" class="t">DNS / sistema</text><text x="800" y="445" text-anchor="middle" class="small">cau · hosts · DNS</text><rect x="1130" y="210" width="380" height="390" class="box" fill="#e9fae6"/><text x="1320" y="290" text-anchor="middle" class="h">InetAddress[]</text><text x="1320" y="365" text-anchor="middle" class="t">93.184.216.34</text><text x="1320" y="425" text-anchor="middle" class="t">IPv6 possible</text><text x="1320" y="505" text-anchor="middle" class="small">getHostAddress()</text><text x="1320" y="550" text-anchor="middle" class="small">getHostName()</text><path d="M475 400H590" stroke="#17324f" stroke-width="6" marker-end="url(#a)"/><path d="M995 400H1110" stroke="#17324f" stroke-width="6" marker-end="url(#a)"/><rect x="450" y="690" width="700" height="105" class="box" fill="#eef5ff"/><text x="800" y="755" text-anchor="middle" class="t">InetAddress.getAllByName("example.org")</text></svg>