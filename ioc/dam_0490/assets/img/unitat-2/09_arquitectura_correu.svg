<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Arquitectura del correu electrònic</title><desc id="d">El client emissor envia per SMTP, els servidors transfereixen per SMTP, i el receptor accedeix a la bústia amb IMAP o POP3.</desc><rect width="1600" height="900" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#17324f}.title{font-size:56px;font-weight:700}.h{font-size:31px;font-weight:700}.t{font-size:25px}.small{font-size:21px}.box{stroke:#17324f;stroke-width:4;rx:22}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17324f"/></marker></defs><text x="800" y="80" text-anchor="middle" class="title">Com viatja un correu</text><rect x="70" y="330" width="280" height="190" class="box" fill="#e7f4ff"/><text x="210" y="400" text-anchor="middle" class="h">Client emissor</text><text x="210" y="455" text-anchor="middle" class="small">aplicació de correu</text><rect x="475" y="300" width="300" height="250" class="box" fill="#fff3cc"/><text x="625" y="375" text-anchor="middle" class="h">Servidor</text><text x="625" y="420" text-anchor="middle" class="h">de sortida</text><rect x="900" y="300" width="300" height="250" class="box" fill="#fff3cc"/><text x="1050" y="375" text-anchor="middle" class="h">Servidor</text><text x="1050" y="420" text-anchor="middle" class="h">destinatari</text><rect x="1275" y="330" width="260" height="190" class="box" fill="#e9fae6"/><text x="1405" y="400" text-anchor="middle" class="h">Bústia</text><text x="1405" y="455" text-anchor="middle" class="small">missatges desats</text><path d="M355 425H460" stroke="#17324f" stroke-width="6" marker-end="url(#a)"/><text x="407" y="390" text-anchor="middle" class="t">SMTP</text><path d="M780 425H885" stroke="#17324f" stroke-width="6" marker-end="url(#a)"/><text x="832" y="390" text-anchor="middle" class="t">SMTP</text><path d="M1205 425H1260" stroke="#17324f" stroke-width="6" marker-end="url(#a)"/><rect x="1140" y="670" width="390" height="130" class="box" fill="#e7f4ff"/><text x="1335" y="725" text-anchor="middle" class="h">Client receptor</text><text x="1335" y="765" text-anchor="middle" class="small">IMAP / POP3</text><path d="M1405 655V535" stroke="#17324f" stroke-width="6" marker-end="url(#a)"/></svg>