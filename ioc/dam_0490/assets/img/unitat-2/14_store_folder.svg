<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Jakarta Mail: Session, Store, Folder i Message</title>
<desc id="desc">Flux d'objectes de Jakarta Mail per accedir a una bústia amb POP3 o IMAP.</desc>
<style>
text{font-family:Arial,sans-serif;fill:#1f2937}.title{font-size:30px;font-weight:700}.label{font-size:22px;font-weight:700}.small{font-size:18px}.box{fill:#f8fafc;stroke:#334155;stroke-width:3}.arrow{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#m)}
</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<text x="600" y="48" text-anchor="middle" class="title">Accedir a una bústia amb Jakarta Mail</text>
<rect x="60" y="190" width="210" height="120" rx="18" class="box"/><text x="165" y="240" text-anchor="middle" class="label">Session</text><text x="165" y="275" text-anchor="middle" class="small">configuració</text>
<rect x="345" y="190" width="210" height="120" rx="18" class="box"/><text x="450" y="235" text-anchor="middle" class="label">Store</text><text x="450" y="270" text-anchor="middle" class="small">POP3 o IMAP</text>
<rect x="630" y="190" width="210" height="120" rx="18" class="box"/><text x="735" y="235" text-anchor="middle" class="label">Folder</text><text x="735" y="270" text-anchor="middle" class="small">INBOX / carpetes</text>
<rect x="915" y="190" width="210" height="120" rx="18" class="box"/><text x="1020" y="235" text-anchor="middle" class="label">Message[]</text><text x="1020" y="270" text-anchor="middle" class="small">correus</text>
<path d="M270 250 H330" class="arrow"/><path d="M555 250 H615" class="arrow"/><path d="M840 250 H900" class="arrow"/>
<text x="450" y="385" text-anchor="middle" class="small">store.connect(host, usuari, contrasenya)</text>
<text x="735" y="430" text-anchor="middle" class="small">folder.open(READ_ONLY / READ_WRITE)</text>
<text x="1020" y="475" text-anchor="middle" class="small">folder.getMessages()</text>
</svg>