<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><rect width="1600" height="900" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#10233f}.title{font-size:62px;font-weight:700}.h{font-size:38px;font-weight:700}.t{font-size:28px}.small{font-size:23px}.box{stroke:#17324f;stroke-width:4;rx:24}</style><text x="800" y="85" text-anchor="middle" class="title">Estats principals d'un fil Java</text>
<defs><marker id="x" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17324f"/></marker></defs>
<rect x="80" y="380" width="240" height="120" class="box" fill="#eef2f6"/><text x="200" y="455" class="h" text-anchor="middle">NEW</text>
<rect x="520" y="350" width="300" height="150" class="box" fill="#d8f5cc"/><text x="670" y="445" class="h" text-anchor="middle">RUNNABLE</text>
<rect x="1160" y="150" width="300" height="120" class="box" fill="#ffd7d7"/><text x="1310" y="225" class="h" text-anchor="middle">BLOCKED</text>
<rect x="1160" y="370" width="300" height="120" class="box" fill="#cde8ff"/><text x="1310" y="445" class="h" text-anchor="middle">WAITING</text>
<rect x="1100" y="600" width="360" height="120" class="box" fill="#fff0b3"/><text x="1280" y="675" class="h" text-anchor="middle">TIMED_WAITING</text>
