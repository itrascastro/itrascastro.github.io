<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Construir un servidor TLS per capes</title><desc id="d">KeyStore alimenta KeyManagerFactory i SSLContext, que crea SSLServerSocket; cada connexió dona un SSLSocket a la sessió.</desc>
<rect width="1600" height="900" fill="#fff"/>
<style>
text{font-family:Arial,sans-serif;fill:#17324f}.title{font-size:54px;font-weight:700}.h{font-size:31px;font-weight:700}.t{font-size:24px}.s{font-size:20px}.box{fill:#f4f8fb;stroke:#17324f;stroke-width:4}.accent{fill:#e8f1f8;stroke:#17324f;stroke-width:4}.good{fill:#eef6ee;stroke:#17324f;stroke-width:4}.warn{fill:#fff5e8;stroke:#17324f;stroke-width:4}.line{stroke:#17324f;stroke-width:5;fill:none}
</style>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17324f"/></marker></defs>
<text x="800" y="75" text-anchor="middle" class="title">Construir un servidor TLS per capes</text>
<rect x="50" y="330" width="250" height="150" rx="22" class="box"/><text x="175" y="390" text-anchor="middle" class="h">KeyStore</text><text x="175" y="440" text-anchor="middle" class="s">clau + certificat</text>
  <path d="M300 405L430 405" class="line" marker-end="url(#a)"/>
  <rect x="430" y="330" width="270" height="150" rx="22" class="accent"/><text x="565" y="390" text-anchor="middle" class="h">KeyManager</text><text x="565" y="440" text-anchor="middle" class="h">Factory</text>
  <path d="M700 405L830 405" class="line" marker-end="url(#a)"/>
  <rect x="830" y="330" width="250" height="150" rx="22" class="accent"/><text x="955" y="390" text-anchor="middle" class="h">SSLContext</text><text x="955" y="440" text-anchor="middle" class="s">TLS</text>
  <path d="M1080 405L1210 405" class="line" marker-end="url(#a)"/>
  <rect x="1210" y="290" width="330" height="230" rx="22" class="good"/><text x="1375" y="360" text-anchor="middle" class="h">SSLServerSocket</text><text x="1375" y="415" text-anchor="middle" class="t">accept()</text><text x="1375" y="465" text-anchor="middle" class="t">→ SSLSocket</text>
  <path d="M1375 520L1375 680" class="line" marker-end="url(#a)"/>
  <rect x="1170" y="680" width="410" height="120" rx="22" class="box"/><text x="1375" y="752" text-anchor="middle" class="h">SmtpSession(Socket)</text>
  <text x="800" y="170" text-anchor="middle" class="h">Transport segur separat de la lògica del protocol</text>
</svg>