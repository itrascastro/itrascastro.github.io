<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Verificar la integritat d'un fitxer</title><desc id="d">Es recalcula SHA-256 del fitxer i es compara amb el resum de referència desat.</desc>
<rect width="1600" height="900" fill="#fff"/>
<style>
text{font-family:Arial,sans-serif;fill:#17324f}.title{font-size:54px;font-weight:700}.h{font-size:31px;font-weight:700}.t{font-size:24px}.s{font-size:20px}.box{fill:#f4f8fb;stroke:#17324f;stroke-width:4}.accent{fill:#e8f1f8;stroke:#17324f;stroke-width:4}.good{fill:#eef6ee;stroke:#17324f;stroke-width:4}.warn{fill:#fff5e8;stroke:#17324f;stroke-width:4}.line{stroke:#17324f;stroke-width:5;fill:none}
</style>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17324f"/></marker></defs>
<text x="800" y="75" text-anchor="middle" class="title">Verificar la integritat d'un fitxer</text>
<rect x="80" y="190" width="420" height="170" rx="22" class="box"/><text x="290" y="250" text-anchor="middle" class="h">missatge.txt</text><text x="290" y="305" text-anchor="middle" class="s">contingut actual</text>
  <rect x="80" y="535" width="420" height="170" rx="22" class="accent"/><text x="290" y="595" text-anchor="middle" class="h">missatge.txt.hash</text><text x="290" y="650" text-anchor="middle" class="s">resum de referència</text>
  <path d="M500 275L700 275" class="line" marker-end="url(#a)"/><text x="600" y="235" text-anchor="middle" class="s">calcular</text>
  <rect x="700" y="190" width="300" height="170" rx="22" class="accent"/><text x="850" y="250" text-anchor="middle" class="h">SHA-256</text><text x="850" y="305" text-anchor="middle" class="s">hash actual</text>
  <path d="M1000 275L1180 420" class="line" marker-end="url(#a)"/><path d="M500 620L1180 460" class="line" marker-end="url(#a)"/>
  <rect x="1180" y="335" width="330" height="210" rx="22" class="good"/><text x="1345" y="405" text-anchor="middle" class="h">Comparar</text><text x="1345" y="465" text-anchor="middle" class="t">igual → OK</text><text x="1345" y="510" text-anchor="middle" class="t">diferent → ALERTA</text>
  <text x="800" y="790" text-anchor="middle" class="s">La referència també s'ha de protegir si l'atacant pot modificar tota la carpeta.</text>
</svg>