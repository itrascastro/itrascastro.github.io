<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Un canvi petit, un hash molt diferent</title><desc id="d">SHA-256 produeix una empremta de 256 bits i un petit canvi a l'entrada altera profundament el resultat.</desc>
<rect width="1600" height="900" fill="#fff"/>
<style>
text{font-family:Arial,sans-serif;fill:#17324f}.title{font-size:54px;font-weight:700}.h{font-size:31px;font-weight:700}.t{font-size:24px}.s{font-size:20px}.box{fill:#f4f8fb;stroke:#17324f;stroke-width:4}.accent{fill:#e8f1f8;stroke:#17324f;stroke-width:4}.good{fill:#eef6ee;stroke:#17324f;stroke-width:4}.warn{fill:#fff5e8;stroke:#17324f;stroke-width:4}.line{stroke:#17324f;stroke-width:5;fill:none}
</style>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17324f"/></marker></defs>
<text x="800" y="75" text-anchor="middle" class="title">Un canvi petit, un hash molt diferent</text>
<rect x="110" y="190" width="500" height="150" rx="22" class="box"/><text x="360" y="250" text-anchor="middle" class="h">hola</text><text x="360" y="305" text-anchor="middle" class="s">entrada A</text>
  <rect x="110" y="535" width="500" height="150" rx="22" class="box"/><text x="360" y="595" text-anchor="middle" class="h">Hola</text><text x="360" y="650" text-anchor="middle" class="s">entrada B: una lletra diferent</text>
  <path d="M610 265L820 265" class="line" marker-end="url(#a)"/><path d="M610 610L820 610" class="line" marker-end="url(#a)"/>
  <rect x="820" y="170" width="270" height="190" rx="22" class="accent"/><text x="955" y="245" text-anchor="middle" class="h">SHA-256</text><text x="955" y="305" text-anchor="middle" class="s">MessageDigest</text>
  <rect x="820" y="515" width="270" height="190" rx="22" class="accent"/><text x="955" y="590" text-anchor="middle" class="h">SHA-256</text><text x="955" y="650" text-anchor="middle" class="s">MessageDigest</text>
  <path d="M1090 265L1290 265" class="line" marker-end="url(#a)"/><path d="M1090 610L1290 610" class="line" marker-end="url(#a)"/>
  <rect x="1290" y="180" width="240" height="170" rx="22" class="good"/><text x="1410" y="240" text-anchor="middle" class="h">2cf24d...</text><text x="1410" y="295" text-anchor="middle" class="s">64 hex</text>
  <rect x="1290" y="525" width="240" height="170" rx="22" class="warn"/><text x="1410" y="585" text-anchor="middle" class="h">753692...</text><text x="1410" y="640" text-anchor="middle" class="s">molt diferent</text>
  <text x="800" y="800" text-anchor="middle" class="t">El hash és una empremta, no un xifrat reversible.</text>
</svg>