<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Keystore i truststore tenen papers diferents</title><desc id="d">El servidor conserva la clau privada i certificat; el client conserva la informació en què confia.</desc>
<rect width="1600" height="900" fill="#fff"/>
<style>
text{font-family:Arial,sans-serif;fill:#17324f}.title{font-size:54px;font-weight:700}.h{font-size:31px;font-weight:700}.t{font-size:24px}.s{font-size:20px}.box{fill:#f4f8fb;stroke:#17324f;stroke-width:4}.accent{fill:#e8f1f8;stroke:#17324f;stroke-width:4}.good{fill:#eef6ee;stroke:#17324f;stroke-width:4}.warn{fill:#fff5e8;stroke:#17324f;stroke-width:4}.line{stroke:#17324f;stroke-width:5;fill:none}
</style>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17324f"/></marker></defs>
<text x="800" y="75" text-anchor="middle" class="title">Keystore i truststore tenen papers diferents</text>
<rect x="90" y="190" width="600" height="470" rx="22" class="accent"/><text x="390" y="255" text-anchor="middle" class="h">Servidor</text>
  <rect x="170" y="320" width="440" height="230" rx="22" class="box"/><text x="390" y="380" text-anchor="middle" class="h">Keystore</text><text x="390" y="435" text-anchor="middle" class="t">clau privada</text><text x="390" y="480" text-anchor="middle" class="t">+ certificat</text>
  <rect x="910" y="190" width="600" height="470" rx="22" class="good"/><text x="1210" y="255" text-anchor="middle" class="h">Client</text>
  <rect x="990" y="320" width="440" height="230" rx="22" class="box"/><text x="1210" y="380" text-anchor="middle" class="h">Truststore</text><text x="1210" y="435" text-anchor="middle" class="t">certificats / CA</text><text x="1210" y="480" text-anchor="middle" class="t">considerats de confiança</text>
  <path d="M610 435L990 435" class="line" marker-end="url(#a)"/><text x="800" y="390" text-anchor="middle" class="s">certificat públic</text>
  <text x="800" y="760" text-anchor="middle" class="h">La clau privada no es distribueix. El certificat sí.</text>
</svg>