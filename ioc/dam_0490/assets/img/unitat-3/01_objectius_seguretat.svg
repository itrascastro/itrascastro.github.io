<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Quatre preguntes de seguretat</title><desc id="d">Confidencialitat, integritat, autenticació i autorització resolen problemes diferents.</desc>
<rect width="1600" height="900" fill="#fff"/>
<style>
text{font-family:Arial,sans-serif;fill:#17324f}.title{font-size:54px;font-weight:700}.h{font-size:31px;font-weight:700}.t{font-size:24px}.s{font-size:20px}.box{fill:#f4f8fb;stroke:#17324f;stroke-width:4}.accent{fill:#e8f1f8;stroke:#17324f;stroke-width:4}.good{fill:#eef6ee;stroke:#17324f;stroke-width:4}.warn{fill:#fff5e8;stroke:#17324f;stroke-width:4}.line{stroke:#17324f;stroke-width:5;fill:none}
</style>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17324f"/></marker></defs>
<text x="800" y="75" text-anchor="middle" class="title">Quatre preguntes de seguretat</text>
<rect x="110" y="180" width="620" height="210" rx="22" class="accent"/><text x="420" y="245" text-anchor="middle" class="h">Confidencialitat</text><text x="420" y="305" text-anchor="middle" class="t">Qui pot llegir la informació?</text>
  <rect x="870" y="180" width="620" height="210" rx="22" class="box"/><text x="1180" y="245" text-anchor="middle" class="h">Integritat</text><text x="1180" y="305" text-anchor="middle" class="t">Les dades han canviat?</text>
  <rect x="110" y="510" width="620" height="210" rx="22" class="box"/><text x="420" y="575" text-anchor="middle" class="h">Autenticació</text><text x="420" y="635" text-anchor="middle" class="t">Qui és l'altre extrem?</text>
  <rect x="870" y="510" width="620" height="210" rx="22" class="accent"/><text x="1180" y="575" text-anchor="middle" class="h">Autorització</text><text x="1180" y="635" text-anchor="middle" class="t">Què pot fer aquesta identitat?</text>
  <text x="800" y="805" text-anchor="middle" class="t">Primer definim el problema; després triem el mecanisme.</text>
</svg>