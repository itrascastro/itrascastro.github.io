<svg xmlns="http://www.w3.org/2000/svg" width="970" height="550" viewBox="0 0 970 550" role="img" aria-labelledby="ttl desc"><title id="ttl">Aspecte orientatiu de la miniaplicació Windows Forms</title><desc id="desc">Esquema educatiu original del curs DAM_0488.</desc><style>
