<svg xmlns="http://www.w3.org/2000/svg" width="950" height="435" viewBox="0 0 950 435" role="img" aria-labelledby="ttl desc"><title id="ttl">Seqüència d'un clic en Windows Forms</title><desc id="desc">Esquema educatiu original del curs DAM_0488.</desc><style>
text{font-family:Inter,Arial,sans-serif;fill:#1c2b40}
.mono{font-family:Consolas,"Fira Code",monospace}
.h{font-size:25px;font-weight:750}
.sub{font-size:15px;fill:#5b6678}
.box-title{font-size:16px;font-weight:700}
.body{font-size:15px}
.small{font-size:13px;fill:#58667d}
.key{fill:#244e92}
.a{fill:#2b659e}
.good{fill:#10745b}
.warn{fill:#ac4e13}
.line{fill:none;stroke:#75859b;stroke-width:2.6}
</style><rect x="1" y="1" width="948" height="433" rx="16" fill="#fff" stroke="#dbe3ed"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7 Z" fill="#7687a0"/></marker></defs>
<text x="34" y="49" class="h">Què passa quan un alumne prem un botó?</text>
<text x="34" y="76" class="sub">La interfície espera. L'esdeveniment avisa; el nostre mètode respon.</text>
<rect x="28" y="108" width="206" height="110" rx="12" fill="#edf4fe" stroke="#87b2e8"/>
<text x="47" y="140" font-size="13" font-weight="750" fill="#3c6b99">1 · PERSONA</text><text x="47" y="170" class="box-title">Fa clic a «Sumar»</text>
<text x="47" y="193" class="small">Acció d'usuari</text>
<rect x="264" y="108" width="206" height="110" rx="12" fill="#f1ecff" stroke="#b59ae6"/>
<text x="283" y="140" font-size="13" font-weight="750" fill="#724aa7">2 · CONTROL</text><text x="283" y="170" class="box-title mono">btnSumar</text>
<text x="283" y="193" class="small">Dispara l'esdeveniment Click</text>
<rect x="500" y="108" width="206" height="110" rx="12" fill="#fff5e8" stroke="#dfba84"/>
<text x="518" y="140" font-size="13" font-weight="750" fill="#a5661e">3 · CODI NOSTRE</text><text x="518" y="169" class="mono" font-size="14" font-weight="750">BtnSumar_Click()</text>
<text x="518" y="193" class="small">Incrementa «clics»</text>
<rect x="736" y="108" width="186" height="110" rx="12" fill="#eaf7f0" stroke="#9bcfb5"/>
<text x="754" y="140" font-size="13" font-weight="750" fill="#19765a">4 · RESULTAT</text><text x="754" y="170" class="mono" font-size="16" font-weight="750">lblComptador</text>
<text x="754" y="193" class="small">Mostra «Clics: 1»</text>
<path d="M236 163 H258" class="line" marker-end="url(#arrow)"/>
<path d="M472 163 H494" class="line" marker-end="url(#arrow)"/>
<path d="M708 163 H730" class="line" marker-end="url(#arrow)"/>
<rect x="45" y="252" width="861" height="76" rx="10" fill="#192d46"/>
<text x="68" y="285" class="mono" font-size="19"><tspan fill="#d3e9ff">btnSumar.</tspan><tspan fill="#91d0ff">Click</tspan><tspan fill="#fff"> += </tspan><tspan fill="#ffd18b">BtnSumar_Click</tspan><tspan fill="#fff">;</tspan></text>
<text x="68" y="311" font-size="13" fill="#b2c9e5">Subscripció: quan el botó avisi, executa aquest mètode.</text>
<path d="M360 329 v22 H95 v17" class="line" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<path d="M743 329 v22 h96 v17" class="line" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<text x="45" y="393" class="body">El clic no executa tot el programa de nou:</text>
<text x="45" y="414" class="small">només s'executen els mètodes subscrits a l'esdeveniment.</text>
</svg>