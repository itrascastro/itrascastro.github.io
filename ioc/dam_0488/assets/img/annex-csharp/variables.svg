<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="ttl desc"><title id="ttl">Anatomia d'una variable en C#</title><desc id="desc">Esquema educatiu original del curs DAM_0488.</desc><style>
text{font-family:Inter,Arial,sans-serif;fill:#1c2b40}
.mono{font-family:Consolas,"Fira Code",monospace}
.h{font-size:25px;font-weight:750}
.sub{font-size:15px;fill:#5b6678}
.box-title{font-size:16px;font-weight:700}
.body{font-size:15px}
.small{font-size:13px;fill:#58667d}
.key{fill:#244e92}
.a{fill:#2b659e}
.good{fill:#10745b}
.warn{fill:#ac4e13}
.line{fill:none;stroke:#75859b;stroke-width:2.6}
</style><rect x="1" y="1" width="898" height="408" rx="16" fill="#fff" stroke="#dbe3ed"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7 Z" fill="#7687a0"/></marker></defs>
<text x="38" y="51" class="h">Una variable: tipus, nom i valor</text>
<text x="38" y="78" class="sub">Cada part té una funció diferent en el llenguatge.</text>
<rect x="210" y="98" width="480" height="76" rx="11" fill="#172d4b"/>
<text x="254" y="147" class="mono" font-size="32"><tspan fill="#95c4ff">int</tspan><tspan fill="#fff"> </tspan><tspan fill="#c3e6ff">unitats</tspan><tspan fill="#fff"> = </tspan><tspan fill="#93e4bb">12</tspan><tspan fill="#fff">;</tspan></text>
<path d="M283 174 V193 H175 V204" class="line" marker-end="url(#arrow)"/><path d="M419 174 V204" class="line" marker-end="url(#arrow)"/><path d="M535 174 V193 H726 V204" class="line" marker-end="url(#arrow)"/>
<rect x="46" y="209" width="255" height="112" rx="10" fill="#edf4fe" stroke="#90b5e0"/>
<text x="70" y="244" class="box-title" fill="#204d86">TIPUS · int</text>
<text x="70" y="270" class="body">Només admet nombres</text><text x="70" y="292" class="body">enters: 0, 1, 12, −3...</text>
<rect x="322" y="209" width="255" height="112" rx="10" fill="#f3efff" stroke="#bca6eb"/>
<text x="347" y="244" class="box-title" fill="#583190">NOM · unitats</text>
<text x="347" y="270" class="body">És com identifiquem</text><text x="347" y="292" class="body">aquesta dada al codi.</text>
<rect x="598" y="209" width="255" height="112" rx="10" fill="#ecf8f2" stroke="#90ceb4"/>
<text x="622" y="244" class="box-title" fill="#147450">VALOR · 12</text>
<text x="622" y="270" class="body">És el contingut actual</text><text x="622" y="292" class="body">de la variable.</text>
<rect x="46" y="345" width="807" height="42" rx="8" fill="#f4f7fa"/>
<text x="66" y="371" class="mono" font-size="17" fill="#254a7e">unitats = unitats + 3;</text><text x="460" y="371" class="body">Ara el valor passa de 12 a 15.</text>
</svg>