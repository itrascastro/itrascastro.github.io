<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="545" viewBox="0 0 1150 545" role="img" aria-labelledby="ttl ds"><title id="ttl">Arquitectura bàsica de la miniaplicació MiniCataleg</title><desc id="ds">Form1 gestiona els controls, GestorProductes desa la llista en memòria, Producte conté el nom i la quantitat.</desc><style>
  text{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;fill:#18324b}
  .title{font-size:27px;font-weight:750;letter-spacing:-.3px}
  .subtitle{font-size:16px;fill:#57718c}
  .panel{fill:#fff;stroke:#d3e3f3;stroke-width:1.5}
  .head{font-size:20px;font-weight:750}
  .body{font-size:17px}
  .small{font-size:15px;fill:#597187}
  .mono{font-family:Consolas,Menlo,monospace}
  .code{font-family:Consolas,Menlo,monospace;font-size:22px}
  .caption{font-size:16px;font-weight:650}
  .num{font-size:17px;font-weight:750;fill:#fff}
</style><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#547eac"/></marker></defs><rect x="1" y="1" width="1148" height="543" rx="17" fill="#f9fbff" stroke="#d9e7f6"/><text x="34" y="49" class="title">Tres classes, tres responsabilitats</text><text x="34" y="78" class="subtitle">Separar la pantalla de les dades ajuda a entendre i mantenir el codi.</text><rect x="30" y="120" width="330" height="258" rx="12" fill="#f0f6ff" stroke="#8db7e0"/><rect x="406" y="120" width="328" height="258" rx="12" fill="#effbf5" stroke="#95cfae"/><rect x="780" y="120" width="338" height="258" rx="12" fill="#fbf2ff" stroke="#d1acec"/><circle cx="61" cy="150" r="19" fill="#336eb1"/><text x="56" y="156" class="num">1</text><text x="92" y="157" class="head">Form1.cs</text><text x="50" y="198" class="caption">Interfície d'usuari</text><text x="50" y="237" class="body">• Llegeix txtNom i txtQuantitat</text><text x="50" y="272" class="body">• Comprova amb int.TryParse</text><text x="50" y="307" class="body">• Atén btnAfegir.Click</text><text x="50" y="342" class="body">• Actualitza el ListBox</text><circle cx="436" cy="150" r="19" fill="#16836b"/><text x="431" y="156" class="num">2</text><text x="470" y="157" class="head">GestorProductes.cs</text><text x="425" y="198" class="caption">Lògica de la col·lecció</text><text x="425" y="237" class="body">• Desa una List&lt;Producte&gt;</text><text x="425" y="272" class="body">• Afegeix productes</text><text x="425" y="307" class="body">• Calcula el Total</text><text x="425" y="342" class="body">• No utilitza controls visuals</text><circle cx="811" cy="150" r="19" fill="#803c9f"/><text x="806" y="156" class="num">3</text><text x="847" y="157" class="head">Producte.cs</text><text x="803" y="198" class="caption">Model de dades</text><text x="801" y="237" class="body">• Nom: string</text><text x="801" y="272" class="body">• Quantitat: int</text><text x="801" y="307" class="body">• Constructor Producte(...)</text><text x="801" y="342" class="body">• ToString()</text><path d="M361 249 L402 249" stroke="#547eac" stroke-width="3" fill="none" marker-end="url(#ar)"/><path d="M735 249 L776 249" stroke="#547eac" stroke-width="3" fill="none" marker-end="url(#ar)"/><rect x="30" y="403" width="1086" height="105" rx="12" fill="#16253d" stroke="#16253d"/><text x="56" y="434" class="mono" font-size="19"><tspan fill="#91d7ff">Form1</tspan><tspan fill="#fff"> rep el </tspan><tspan fill="#fad58a">Click</tspan><tspan fill="#fff">, crea un </tspan><tspan fill="#cba7ff">Producte</tspan><tspan fill="#fff"> i crida </tspan><tspan fill="#92e6ba">gestor.Afegir(nou)</tspan><tspan fill="#fff">.</tspan></text><text x="56" y="472" class="body" fill="#fff">El gestor no ha de conèixer ni els botons ni les etiquetes del formulari.</text></svg>