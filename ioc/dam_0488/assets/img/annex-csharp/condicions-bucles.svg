<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="535" viewBox="0 0 1120 535" role="img" aria-labelledby="ttl ds"><title id="ttl">Condicions i bucles bàsics de C#</title><desc id="ds">Diferencia if per decidir, for per repetir un nombre de cops i foreach per recórrer objectes o dades.</desc><style>
  text{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;fill:#18324b}
  .title{font-size:27px;font-weight:750;letter-spacing:-.3px}
  .subtitle{font-size:16px;fill:#57718c}
  .panel{fill:#fff;stroke:#d3e3f3;stroke-width:1.5}
  .head{font-size:20px;font-weight:750}
  .body{font-size:17px}
  .small{font-size:15px;fill:#597187}
  .mono{font-family:Consolas,Menlo,monospace}
  .code{font-family:Consolas,Menlo,monospace;font-size:22px}
  .caption{font-size:16px;font-weight:650}
  .num{font-size:17px;font-weight:750;fill:#fff}
</style><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#547eac"/></marker></defs><rect x="1" y="1" width="1118" height="533" rx="17" fill="#f9fbff" stroke="#d9e7f6"/><text x="32" y="48" class="title">Condicions i bucles: decidir o repetir</text><text x="32" y="79" class="subtitle">La condició controla el camí; els bucles repeteixen les instruccions.</text><rect x="28" y="113" width="336" height="377" rx="12" fill="#fff" stroke="#c8d9ea"/><rect x="392" y="113" width="337" height="377" rx="12" fill="#fff" stroke="#c8d9ea"/><rect x="755" y="113" width="336" height="377" rx="12" fill="#fff" stroke="#c8d9ea"/><circle cx="61" cy="149" r="19" fill="#49328d"/><text x="56" y="155" class="num">1</text><text x="91" y="155" class="head">if · escollir un camí</text><rect x="43" y="180" width="299" height="76" rx="8" fill="#16253d" stroke="#16253d"/><text x="56" y="209" class="mono" font-size="18"><tspan fill="#c7a1ff">if</tspan><tspan fill="#fff"> (estoc == 0)</tspan></text><text x="56" y="238" class="mono" font-size="18"><tspan fill="#91d7ff">Mostrar</tspan><tspan fill="#fff">("Esgotat");</tspan></text><text x="47" y="294" class="body">La pregunta és certa?</text><rect x="49" y="316" width="115" height="46" rx="12" fill="#e7f8ef" stroke="#7dc7a3"/><text x="65" y="345" class="caption">Sí: executa</text><rect x="193" y="316" width="145" height="46" rx="12" fill="#fff1eb" stroke="#eab18d"/><text x="209" y="345" class="caption">No: continua</text><text x="49" y="401" class="small">== compara dos valors.</text><text x="49" y="428" class="small">= assigna un valor.</text><circle cx="425" cy="149" r="19" fill="#3275bd"/><text x="420" y="155" class="num">2</text><text x="456" y="155" class="head">for · repetir 3 cops</text><rect x="408" y="180" width="306" height="76" rx="8" fill="#16253d" stroke="#16253d"/><text x="422" y="208" class="mono" font-size="17"><tspan fill="#c7a1ff">for</tspan><tspan fill="#fff"> (int i=0; i&lt;3; i++)</tspan></text><text x="422" y="235" class="mono" font-size="18"><tspan fill="#91d7ff">Mostrar</tspan><tspan fill="#fff">(i);</tspan></text><text x="417" y="293" class="body">Valors que pren i:</text><rect x="419" y="313" width="74" height="48" rx="12" fill="#eaf4ff" stroke="#9cc6eb"/><rect x="519" y="313" width="74" height="48" rx="12" fill="#eaf4ff" stroke="#9cc6eb"/><rect x="619" y="313" width="74" height="48" rx="12" fill="#eaf4ff" stroke="#9cc6eb"/><text x="446" y="345" class="code">0</text><text x="546" y="345" class="code">1</text><text x="646" y="345" class="code">2</text><path d="M496 337 L516 337" stroke="#547eac" stroke-width="3" fill="none" marker-end="url(#ar)"/><path d="M597 337 L617 337" stroke="#547eac" stroke-width="3" fill="none" marker-end="url(#ar)"/><text x="415" y="404" class="small">i++ suma 1 en cada volta.</text><text x="415" y="431" class="small">Quan i arriba a 3, s'atura.</text><circle cx="789" cy="149" r="19" fill="#128575"/><text x="784" y="155" class="num">3</text><text x="821" y="155" class="head">foreach · recórrer</text><rect x="772" y="180" width="300" height="76" rx="8" fill="#16253d" stroke="#16253d"/><text x="784" y="208" class="mono" font-size="16"><tspan fill="#c7a1ff">foreach</tspan><tspan fill="#fff"> (var p in productes)</tspan></text><text x="784" y="235" class="mono" font-size="17"><tspan fill="#91d7ff">Mostrar</tspan><tspan fill="#fff">(p.Nom);</tspan></text><rect x="772" y="288" width="301" height="63" rx="12" fill="#eaf4ff" stroke="#9cc6eb"/><text x="790" y="315" class="caption">Llista:</text><text x="790" y="338" class="body">Teclat · Ratolí · Pantalla</text><rect x="772" y="367" width="301" height="74" rx="12" fill="#e9f8f0" stroke="#9ed6b8"/><text x="789" y="392" class="caption">Visita cada producte</text><text x="789" y="418" class="small">un a un, en ordre.</text><rect x="27" y="502" width="1065" height="24" rx="6" fill="#eee9fc" stroke="#d4c8f7"/><text x="41" y="520" class="small">Recordeu: una condició decideix i un bucle repeteix. Eviteu modificar una llista mentre la recorreu amb foreach.</text></svg>