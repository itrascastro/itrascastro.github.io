<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475" role="img" aria-labelledby="ttl desc"><title id="ttl">Classe i objectes en C#</title><desc id="desc">Esquema educatiu original del curs DAM_0488.</desc><style>
