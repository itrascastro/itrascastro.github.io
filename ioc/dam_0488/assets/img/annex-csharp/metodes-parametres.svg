<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="ttl ds"><title id="ttl">Anatomia i execució d'un mètode C#</title><desc id="ds">Cridar SumarUnitats amb arguments 5 i 3, assignar paràmetres, executar return i obtenir 8.</desc><style>
  text{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;fill:#18324b}
  .title{font-size:27px;font-weight:750;letter-spacing:-.3px}
  .subtitle{font-size:16px;fill:#57718c}
  .panel{fill:#fff;stroke:#d3e3f3;stroke-width:1.5}
  .head{font-size:20px;font-weight:750}
  .body{font-size:17px}
  .small{font-size:15px;fill:#597187}
  .mono{font-family:Consolas,Menlo,monospace}
  .code{font-family:Consolas,Menlo,monospace;font-size:22px}
  .caption{font-size:16px;font-weight:650}
  .num{font-size:17px;font-weight:750;fill:#fff}
</style><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#547eac"/></marker></defs><rect x="1" y="1" width="1118" height="478" rx="17" fill="#f9fbff" stroke="#d9e7f6"/><text x="35" y="49" class="title">Mètodes i paràmetres en C#</text><text x="35" y="79" class="subtitle">Primer fem una crida; després el mètode rep dades, calcula i retorna un resultat.</text><rect x="32" y="112" width="490" height="298" rx="12" fill="#fff" stroke="#bfd2e8"/><rect x="552" y="112" width="537" height="298" rx="12" fill="#fff" stroke="#bfd2e8"/><circle cx="66" cy="146" r="19" fill="#49328d"/><text x="61" y="152" class="num">1</text><text x="102" y="152" class="head">La crida: arguments reals</text><rect x="52" y="171" width="443" height="60" rx="8" fill="#16253d" stroke="#16253d"/><text x="70" y="209" class="code"><tspan fill="#8dd1ff">int</tspan><tspan fill="#fff"> total = </tspan><tspan fill="#fad47a">SumarUnitats</tspan><tspan fill="#fff">(</tspan><tspan fill="#93e6bd">5</tspan><tspan fill="#fff">, </tspan><tspan fill="#93e6bd">3</tspan><tspan fill="#fff">);</tspan></text><rect x="53" y="258" width="200" height="60" rx="12" fill="#eaf4ff" stroke="#92bee6"/><text x="68" y="281" class="code">actuals = 5</text><text x="68" y="303" class="small">Primer paràmetre</text><rect x="273" y="258" width="218" height="60" rx="12" fill="#ecf8f0" stroke="#a5d9bb"/><text x="287" y="281" class="code">noves = 3</text><text x="287" y="303" class="small">Segon paràmetre</text><text x="61" y="372" class="small">Els arguments 5 i 3 s'assignen als</text><text x="61" y="395" class="small">paràmetres actuals i noves.</text><circle cx="589" cy="146" r="19" fill="#137a67"/><text x="584" y="152" class="num">2</text><text x="625" y="152" class="head">El mètode: definició i retorn</text><rect x="570" y="171" width="500" height="140" rx="8" fill="#16253d" stroke="#16253d"/><text x="583" y="205" class="mono" font-size="18"><tspan fill="#9bd6ff">static int </tspan><tspan fill="#fad47a">SumarUnitats</tspan><tspan fill="#fff">(</tspan><tspan fill="#99ddb7">int</tspan><tspan fill="#fff"> actuals, </tspan><tspan fill="#99ddb7">int</tspan><tspan fill="#fff"> noves)</tspan></text><text x="583" y="234" class="mono" font-size="19" fill="#fff">{</text><text x="617" y="265" class="mono" font-size="19"><tspan fill="#e7a1cc">return</tspan><tspan fill="#fff"> actuals + noves;</tspan></text><text x="583" y="295" class="mono" font-size="19" fill="#fff">}</text><rect x="571" y="328" width="501" height="64" rx="12" fill="#ecf8f0" stroke="#9ed4b6"/><text x="587" y="351" class="head">Retorna 5 + 3 = 8</text><text x="587" y="379" class="small">total val 8. El tipus de retorn és int.</text><rect x="29" y="431" width="1058" height="35" rx="8" fill="#eee9fc" stroke="#c4b7ef"/><text x="47" y="454" class="body">Si un mètode no torna cap valor, el seu tipus de retorn és void.</text></svg>